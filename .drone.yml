kind: pipeline
type: vm
name: default

platform:
  os: linux
  arch: amd64
pool:
  use: ubuntu

steps:
- name: build
  image: golang:1.26.10@sha256:672c944cfd07599b5f1bb179869270cdc94c6254e41db4d431259693cb286b82
  commands:
  - go test ./...
  - sh scripts/build.sh

- name: publish
  image: plugins/docker
  pull: if-not-exists
  settings:
    repo: plugins/github-actions
    dockerfile: docker/Dockerfile.linux.amd64
    username:
      from_secret: docker_username
    password:
      from_secret: docker_password
    auto_tag: true
trigger:
  ref:
    - refs/heads/main
    - refs/tags/**
    - refs/pull/**
